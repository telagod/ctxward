<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ctxward</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font: 14px/1.5 -apple-system, system-ui, sans-serif;
        margin: 0; padding: 24px; background: #0f1115; color: #e6e6e6;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .sub { color: #8a8f98; margin: 0 0 20px; }
      .row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
      button {
        background: #2b6cb0; color: #fff; border: 0; border-radius: 6px;
        padding: 8px 16px; font-size: 14px; cursor: pointer;
      }
      button.secondary { background: #2d333b; }
      button:disabled { opacity: .5; cursor: default; }
      #status { font-weight: 600; }
      #status.on { color: #48bb78; }
      #status.off { color: #e05252; }
      pre {
        background: #161a20; border: 1px solid #2d333b; border-radius: 6px;
        padding: 12px; overflow: auto; max-height: 240px; font-size: 12px;
      }
      .label { color: #8a8f98; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    </style>
  </head>
  <body>
    <h1>Ctxward</h1>
    <p class="sub">Transparent LLM-privacy gateway — every prompt cleaned before it leaves your machine.</p>

    <div class="row">
      <span class="label">Proxy</span>
      <span id="status" class="off">stopped</span>
      <button id="toggle">Start</button>
      <button id="plan" class="secondary">Show integration plan</button>
    </div>

    <div class="label">Root CA</div>
    <pre id="ca">—</pre>

    <div class="label">Integration plan</div>
    <pre id="planOut">—</pre>

    <script type="module">
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;

      const statusEl = document.getElementById("status");
      const toggleEl = document.getElementById("toggle");

      function setStatus(running) {
        statusEl.textContent = running ? "running" : "stopped";
        statusEl.className = running ? "on" : "off";
        toggleEl.textContent = running ? "Stop" : "Start";
      }

      async function refresh() {
        setStatus(await invoke("proxy_status"));
        try { document.getElementById("ca").textContent = (await invoke("ca_cert_pem")) ?? "(not generated yet)"; }
        catch (e) { document.getElementById("ca").textContent = String(e); }
      }

      toggleEl.addEventListener("click", async () => {
        const running = await invoke("proxy_status");
        await invoke(running ? "stop_proxy" : "start_proxy");
        await refresh();
      });

      document.getElementById("plan").addEventListener("click", async () => {
        try {
          const plan = await invoke("integration_plan", { host: "127.0.0.1", port: 8888 });
          document.getElementById("planOut").textContent = plan.join("\n");
        } catch (e) { document.getElementById("planOut").textContent = String(e); }
      });

      listen("proxy://status", (e) => setStatus(e.payload === "running"));
      listen("proxy://error", (e) => { document.getElementById("planOut").textContent = "error: " + e.payload; });

      refresh();
    </script>
  </body>
</html>
