[package]
name = "ctxward-core"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Ctxward core: detection, redaction, reversible tokenization, policy, and config types — no network/server IO, reusable from the gateway, the desktop shell, and (compiled to WASM) the browser extension."
rust-version = "1.85"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.9"
thiserror = "2"
regex = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm-siv = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
http = "1"
