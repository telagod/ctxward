name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Run once per ref: a PR-branch push fires `pull_request` only (push is scoped
# to main), so the bench gate no longer runs twice (push + PR) per commit.
# Newer commits on the same ref cancel superseded in-progress runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Rust tests
        run: make test

      - name: Clippy
        run: make clippy

      - name: Bench gate smoke fixtures
        run: |
          make smoke-bench-gate
          make smoke-bench-drift

  bench:
    name: bench
    runs-on: ubuntu-latest
    needs: verify
    # GitHub-hosted runners share hardware; bench latency p95 can hit the
    # regression gate on noisy neighbours. Until we have a dedicated runner,
    # bench is informational-only — it still runs and uploads artifacts, but
    # transient latency failures must not block merges.
    continue-on-error: true
    concurrency:
      group: context-gurd-bench-${{ github.ref }}
      cancel-in-progress: false
    # Relax the absolute perf gate for shared CI hardware (throughput floor
    # halved, latency ceilings doubled). Local/dedicated runs keep the strict
    # defaults (1.0); a real multiple-x regression still trips even when relaxed.
    env:
      BENCH_RPS_FLOOR_SCALE: "0.5"
      BENCH_LATENCY_CEIL_SCALE: "2.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run bench matrix + gate serially
        run: make bench-ci

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-matrix-${{ github.run_id }}
          path: .tmp-smoke/bench-matrix
          if-no-files-found: warn
