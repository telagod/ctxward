name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write     # for cosign keyless via OIDC
  attestations: write # for SLSA provenance

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ctxward
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # --------------------------------------------------------------------------
  # Build cross-platform binaries
  # --------------------------------------------------------------------------
  build-binaries:
    name: binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          # Note: x86_64-apple-darwin removed because GitHub-hosted macos-13
          # runners are presently queue-throttled for free-tier accounts.
          # Will be reintroduced once the project moves to a paid plan or a
          # community-hosted Intel Mac runner is available. Intel macOS users
          # can build from source via `cargo install --locked --git ...`.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (linux aarch64)
        if: matrix.cross
        run: cargo install --locked cross

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          NAME="ctxward-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/context-gurd" "dist/${NAME}/ctxward"
          cp LICENSE README.md CHANGELOG.md "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/${{ steps.pkg.outputs.name }}.tar.gz*

  # --------------------------------------------------------------------------
  # SBOM (source-level)
  # --------------------------------------------------------------------------
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx
      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json --all
          # cargo-cyclonedx writes <crate>.cdx.json next to each Cargo.toml.
          # Surface them under sbom/ for the artifact.
          mkdir -p sbom
          find . -maxdepth 3 -name '*.cdx.json' -exec cp {} sbom/ \;
          ls -la sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/*.cdx.json

  # --------------------------------------------------------------------------
  # Multi-arch container image
  # --------------------------------------------------------------------------
  build-image:
    name: container image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # Sign image + attest SBOM (cosign keyless)
  # --------------------------------------------------------------------------
  sign-image:
    name: cosign sign
    needs: [build-image, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign each tag (keyless)
        env:
          DIGEST: ${{ needs.build-image.outputs.digest }}
          TAGS: ${{ needs.build-image.outputs.tags }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom-files

      - name: Attest SBOM
        env:
          DIGEST: ${{ needs.build-image.outputs.digest }}
          TAGS: ${{ needs.build-image.outputs.tags }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          SBOM=$(find sbom-files -name '*.cdx.json' | head -n1)
          if [ -z "$SBOM" ]; then
            echo "::warning::no SBOM file found, skipping attest"
            exit 0
          fi
          for tag in $TAGS; do
            cosign attest --yes --predicate "$SBOM" --type cyclonedx "${tag}@${DIGEST}"
          done

  # --------------------------------------------------------------------------
  # Publish GitHub Release
  # --------------------------------------------------------------------------
  publish-release:
    name: gh release
    needs: [build-binaries, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute combined checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.cdx.json' \) -exec cp {} release/ \;
          (cd release && shasum -a 256 * > SHA256SUMS)

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/*
