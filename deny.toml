# cargo-deny configuration for Ctxward
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ----------------------------------------------------------------------------
# advisories — block on known CVEs and unmaintained crates
# ----------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = []

# ----------------------------------------------------------------------------
# licenses — Ctxward ships under Apache-2.0. Allow common permissive licenses;
# require explicit decision on copyleft.
# ----------------------------------------------------------------------------
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  # Required by webpki-roots (pulled in via reqwest -> hyper-rustls).
  # CDLA-Permissive-2.0 is OSI-permissive; tracked at:
  # https://cdla.dev/permissive-2-0/
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
  { path = "LICENSE", hash = 0xbd0eed23 },
]

# ----------------------------------------------------------------------------
# bans — pin against wildcard deps and known-bad crates.
# Multiple-versions is allowed: the dependency graph (axum/reqwest/hyper/tokio
# ecosystem) routinely pulls 2× of small utility crates such as winnow,
# hashbrown, and getrandom. We track these via `cargo tree --duplicates`
# locally rather than failing CI on natural ecosystem churn.
# ----------------------------------------------------------------------------
[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

# ----------------------------------------------------------------------------
# sources — only allow crates.io and the project's own git deps (none today)
# ----------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
