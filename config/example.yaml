server:
  bind: 127.0.0.1:8080
  request_body_limit_bytes: 1048576

upstream:
  base_url: https://api.openai.com/
  timeout_ms: 60000
  connect_timeout_ms: 5000
  auth_header: Authorization
  auth_value_env: OPENAI_API_KEY
  forward_headers:
    - content-type
    - accept
    - openai-organization
    - openai-project
    - x-request-id

auth:
  header_name: authorization
  principals:
    - name: demo-app
      tenant_id: engineering
      role: employee
      clearance: internal
      secret_sha256: cd577fe2561ebff23505db0bb006300c7cdecbd46bc0e03c449afafaca2c25bf
      allowed_labels:
        - email
    - name: security-admin
      tenant_id: secops
      role: admin
      clearance: restricted
      secret_sha256: 16175223c8ddce5ace0493c948569c211b03c4c6bb3d3e484434999448cffe01
      allowed_labels:
        - email
        - phone
        - national_id
        - ip_address
        - mac_address
        - imei
        - vin
        - bank_card
        - api_key
        - bearer_token

detection:
  ignore_json_pointers:
    - /model
  presidio:
    enabled: false
    analyzer_url: http://127.0.0.1:3000/analyze
    healthcheck_url: http://127.0.0.1:3000/health
    timeout_ms: 250
    language: en
    entities:
      - entity_type: PERSON
        label: person
        severity: medium
        authorized_action: redact
        unauthorized_action: redact
        min_clearance: internal
        masking: placeholder
        min_score: 0.35
      - entity_type: LOCATION
        label: location
        severity: low
        authorized_action: allow
        unauthorized_action: redact
        min_clearance: internal
        masking: placeholder
        min_score: 0.35
  high_entropy:
    enabled: true
    min_length: 20
    min_entropy: 3.6
    label: secret_like
    severity: high
    authorized_action: redact
    unauthorized_action: block
    min_clearance: confidential
    masking: hash
  rules:
    - name: email
      label: email
      pattern: '(?i)(?:^|[^A-Z0-9._%+-])([A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,})(?:$|[^A-Z0-9._%+-])'
      severity: medium
      authorized_action: allow
      unauthorized_action: redact
      min_clearance: internal
      masking: partial_email
    - name: phone_cn
      label: phone
      pattern: '(?:^|[^0-9])(1[3-9]\d{9})(?:$|[^0-9])'
      severity: high
      authorized_action: allow
      unauthorized_action: block
      min_clearance: confidential
      masking: partial_phone
    - name: china_national_id
      label: national_id
      pattern: '(?:^|[^0-9Xx])(\d{17}[\dXx])(?:$|[^0-9Xx])'
      severity: critical
      authorized_action: allow
      unauthorized_action: block
      min_clearance: restricted
      masking: keep_last4
    - name: ip_address
      label: ip_address
      pattern: '(?:^|[^0-9.])((?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3})(?:$|[^0-9.])'
      severity: medium
      authorized_action: allow
      unauthorized_action: redact
      min_clearance: internal
      masking: placeholder
    - name: mac_address
      label: mac_address
      pattern: '(?i)(?:^|[^0-9A-F])((?:[0-9A-F]{2}[:-]){5}[0-9A-F]{2})(?:$|[^0-9A-F])'
      severity: high
      authorized_action: allow
      unauthorized_action: redact
      min_clearance: confidential
      masking: placeholder
    - name: imei
      label: imei
      pattern: '(?:^|[^0-9])(\d{15})(?:$|[^0-9])'
      severity: critical
      authorized_action: allow
      unauthorized_action: block
      min_clearance: restricted
      masking: keep_last4
    - name: vin
      label: vin
      pattern: '(?i)(?:^|[^A-HJ-NPR-Z0-9])([A-HJ-NPR-Z0-9]{17})(?:$|[^A-HJ-NPR-Z0-9])'
      severity: high
      authorized_action: allow
      unauthorized_action: redact
      min_clearance: confidential
      masking: placeholder
    - name: bank_card
      label: bank_card
      pattern: '(?:^|[^0-9])(\d{16,19})(?:$|[^0-9])'
      severity: critical
      authorized_action: redact
      unauthorized_action: block
      min_clearance: restricted
      masking: keep_last4
    - name: openai_key
      label: api_key
      pattern: '(?:^|[^A-Za-z0-9-])(sk-[A-Za-z0-9]{20,})(?:$|[^A-Za-z0-9-])'
      severity: critical
      authorized_action: redact
      unauthorized_action: block
      min_clearance: restricted
      masking: hash
    - name: bearer_token
      label: bearer_token
      pattern: '(?i)Bearer\s+[A-Za-z0-9._\-]{16,}'
      severity: critical
      authorized_action: redact
      unauthorized_action: block
      min_clearance: restricted
      masking: hash

policy_backend:
  opa:
    enabled: false
    url: http://127.0.0.1:8181/v1/data/llm/privacy/decision
    healthcheck_url: http://127.0.0.1:8181/health
    timeout_ms: 150
    fail_open: true

tokenization:
  enabled: false
  key_env: CONTEXT_GURD_TOKENIZATION_KEY
  token_prefix: CGT1

session:
  enabled: true
  header_name: x-session-id
  ttl_secs: 1800
  max_entries: 5000
  correlation_threshold: 2
  trigger_action: review

response_filtering:
  enabled: true
  scan_json: true
  scan_sse: true

attachments:
  enabled: false
  max_bytes: 5242880
  max_text_chars: 32768
  allowed_media_types:
    - text/*
    - application/json
    - application/xml
    - text/xml
    - text/csv
    - application/pdf
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - application/vnd.openxmlformats-officedocument.presentationml.presentation

review:
  capacity: 1000
  preview_chars: 256
  approval_ttl_secs: 900
  jsonl_path: ./review.log

benchmarks:
  enabled: true
  summary_json_path: ./.tmp-smoke/bench-matrix/summary.json
  baseline_summary_json_path: ./.tmp-smoke/bench-matrix/baseline.json
  gate_report_json_path: ./.tmp-smoke/bench-matrix/gate-report.json

audit:
  jsonl_path: ./audit.log
  emit_stdout: true
  buffer_capacity: 1000
